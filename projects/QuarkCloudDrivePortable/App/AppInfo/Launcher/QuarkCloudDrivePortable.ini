[Launch]
; 直接启动夸克主程序，不再走bat
ProgramExecutable=QuarkCloudDrive\QuarkCloudDrive.exe
; 后台运行，无CMD黑窗口
RunInBackground=true
; 等待夸克进程结束再退出
WaitForExe=QuarkCloudDrive.exe

[Activate]
Registry=true
Directories=true

; 注册表沙盒：隔离右键菜单、软件配置
[RegistryKeys]
QCDrive_Up1=HKCR\*\shell\QuarkCloudDrive.upload
QCDrive_Up2=HKCR\Directory\shell\QuarkCloudDrive.upload
QCDrive_Bak=HKCR\Directory\shell\QuarkCloudDrive.backup
QCDrive_Cfg=HKCU\Software\QuarkCloudDrive

; 目录沙盒：AppData、LocalAppData 夸克目录全部重定向到包内Data
[DirectoriesMove]
QK_APPDATA=quark-cloud-drive|%APPDATA%\quark-cloud-drive
QK_LOCAL1=quark-cloud-drive|%LOCALAPPDATA%\quark-cloud-drive
QK_LOCAL2=quark-cloud-drive-updater|%LOCALAPPDATA%\quark-cloud-drive-updater

; 退出自动清理空目录
[DirectoriesCleanupIfEmpty]
1=%APPDATA%\quark-cloud-drive
2=%LOCALAPPDATA%\quark-cloud-drive
3=%LOCALAPPDATA%\quark-cloud-drive-updater